<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast - Original</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      padding: 10px;
    }

    .game-container {
      background: #1a1a2e;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 480px;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      color: #fff;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .title span {
      color: #667eea;
    }

    .stats {
      text-align: right;
    }

    .score-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
    }

    .score-value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
    }

    .board {
      background: #16213e;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      aspect-ratio: 1;
    }

    .block {
      background: #0f3460;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      position: relative;
    }

    .block:hover:not(.empty) {
      transform: scale(1.05);
    }

    .block.empty {
      background: #0f3460;
      cursor: pointer;
    }

    .block.empty:hover {
      background: #1a4d7a;
    }

    /* RANGLI BLOKLAR */
    .block.c1 {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .block.c2 {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }

    .block.c3 {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }

    .block.c4 {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3);
    }

    .block.c5 {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      box-shadow: 0 4px 15px rgba(250, 112, 154, 0.3);
    }

    .block.c6 {
      background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
      box-shadow: 0 4px 15px rgba(48, 207, 208, 0.3);
    }

    .block.matched {
      animation: matchAnimation 0.4s ease;
    }

    @keyframes matchAnimation {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(0); opacity: 0; }
    }

    .next-section {
      background: #16213e;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      color: #fff;
    }

    .next-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .next-blocks {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .next-block {
      width: 70px;
      height: 70px;
      background: #0f3460;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      border: 2px solid #243b53;
      transition: all 0.3s ease;
    }

    .next-block.preview-c1 {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: #667eea;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .next-block.preview-c2 {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-color: #f5576c;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }

    .next-block.preview-c3 {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border-color: #00f2fe;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }

    .next-block.preview-c4 {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      border-color: #38f9d7;
      box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3);
    }

    .next-block.preview-c5 {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      border-color: #fee140;
      box-shadow: 0 4px 15px rgba(250, 112, 154, 0.3);
    }

    .next-block.preview-c6 {
      background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
      border-color: #30cfd0;
      box-shadow: 0 4px 15px rgba(48, 207, 208, 0.3);
    }

    .buttons-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00ff88 0%, #00dd77 100%);
      color: #000;
      grid-column: span 2;
      font-size: 18px;
    }

    .btn-primary:hover {
      box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #667eea;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #5568d3;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #ff6b6b;
      color: #fff;
    }

    .btn-danger:hover {
      background: #ee5a52;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
      transform: translateY(-2px);
    }

    .game-over-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .game-over-modal.show {
      display: flex;
    }

    .modal-content {
      background: #1a1a2e;
      padding: 50px 40px;
      border-radius: 25px;
      text-align: center;
      color: #fff;
      animation: slideIn 0.4s ease;
      max-width: 400px;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-title {
      font-size: 48px;
      margin-bottom: 20px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .modal-score {
      font-size: 36px;
      color: #667eea;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-text {
      font-size: 16px;
      color: #888;
      margin-bottom: 30px;
    }

    .modal-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #00ff88 0%, #00dd77 100%);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-btn:hover {
      box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
      transform: scale(1.02);
    }

    @media (max-width: 500px) {
      .game-container {
        padding: 18px;
      }

      .title {
        font-size: 24px;
      }

      .score-value {
        font-size: 24px;
      }

      .block {
        font-size: 20px;
      }

      .next-block {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- HEADER -->
    <div class="top-section">
      <div class="title">BLOCK <span>BLAST</span></div>
      <div class="stats">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="scoreDisplay">0</div>
      </div>
    </div>

    <!-- GAME BOARD -->
    <div class="board" id="gameBoard"></div>

    <!-- NEXT BLOCKS -->
    <div class="next-section">
      <div class="next-label">Next Blocks</div>
      <div class="next-blocks" id="nextBlocksDisplay"></div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons-section">
      <button class="btn btn-primary" id="newGameBtn">🎮 New Game</button>
      <button class="btn btn-secondary" id="helpBtn">? Help</button>
      <button class="btn btn-danger" id="resetBtn">🔄 Reset</button>
    </div>
  </div>

  <!-- GAME OVER MODAL -->
  <div class="game-over-modal" id="gameOverModal">
    <div class="modal-content">
      <div class="modal-title">🎮 GAME OVER!</div>
      <div class="modal-score" id="finalScore">0</div>
      <div class="modal-text">Tabriklayman!</div>
      <button class="modal-btn" id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script>
    class BlockBlast {
      constructor() {
        this.ROWS = 6;
        this.COLS = 6;
        this.colors = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'];
        this.board = this.createBoard();
        this.score = 0;
        this.gameActive = true;
        this.nextBlocks = this.generateNextBlocks();
        this.currentBlockIndex = 0;

        this.setupEventListeners();
        this.render();
      }

      createBoard() {
        return Array(this.ROWS * this.COLS).fill(0);
      }

      generateNextBlocks() {
        return [
          this.colors[Math.floor(Math.random() * this.colors.length)],
          this.colors[Math.floor(Math.random() * this.colors.length)],
          this.colors[Math.floor(Math.random() * this.colors.length)]
        ];
      }

      setupEventListeners() {
        document.getElementById('newGameBtn').addEventListener('click', () => this.newGame());
        document.getElementById('helpBtn').addEventListener('click', () => this.showHelp());
        document.getElementById('resetBtn').addEventListener('click', () => this.resetBoard());
        document.getElementById('playAgainBtn').addEventListener('click', () => this.newGame());
      }

      placeBlock(index) {
        if (!this.gameActive || this.board[index] !== 0) return;

        const currentColor = this.nextBlocks[this.currentBlockIndex];
        this.board[index] = currentColor;
        this.score += 10;

        this.checkMatches();
        this.nextBlocks.shift();
        this.nextBlocks.push(this.colors[Math.floor(Math.random() * this.colors.length)]);
        this.currentBlockIndex = 0;

        if (!this.hasEmptyCell()) {
          this.gameActive = false;
          this.showGameOver();
        }

        this.render();
      }

      checkMatches() {
        let matched = [];

        // Check rows
        for (let row = 0; row < this.ROWS; row++) {
          for (let col = 0; col < this.COLS - 2; col++) {
            const idx1 = row * this.COLS + col;
            const idx2 = row * this.COLS + col + 1;
            const idx3 = row * this.COLS + col + 2;

            if (
              this.board[idx1] !== 0 &&
              this.board[idx1] === this.board[idx2] &&
              this.board[idx2] === this.board[idx3]
            ) {
              matched.push(idx1, idx2, idx3);
            }
          }
        }

        // Check columns
        for (let col = 0; col < this.COLS; col++) {
          for (let row = 0; row < this.ROWS - 2; row++) {
            const idx1 = row * this.COLS + col;
            const idx2 = (row + 1) * this.COLS + col;
            const idx3 = (row + 2) * this.COLS + col;

            if (
              this.board[idx1] !== 0 &&
              this.board[idx1] === this.board[idx2] &&
              this.board[idx2] === this.board[idx3]
            ) {
              matched.push(idx1, idx2, idx3);
            }
          }
        }

        // Remove duplicates
        matched = [...new Set(matched)];

        // Clear matched blocks
        matched.forEach(idx => {
          this.board[idx] = 0;
          this.score += 50;
        });

        // Gravity - bloklar pastga tusadi
        if (matched.length > 0) {
          this.applyGravity();
          this.checkMatches(); // Recursive check
        }
      }

      applyGravity() {
        for (let col = 0; col < this.COLS; col++) {
          let filled = [];
          
          for (let row = 0; row < this.ROWS; row++)
